id: pomona-sensor-quality-reasoner-v0.1
name: Pomona Sensor Quality Reasoner
version: 0.1.0
author: Okyanus
license: apache-2.0

type: sensor_quality_reasoner
status: needs_targeted_improvement

github:
  platform_repo: Okyanus/pomona
  docs: docs/SENSOR_QUALITY_REASONER.md

huggingface:
  repo_id: null
  base_model: Qwen/Qwen2.5-0.5B-Instruct
  url: null
  dataset: null
  published: false

runtime:
  engine: peft-lora
  format: safetensors
  output_format: json_object
  backends:
    - huggingface_local
    - rules_fallback
    - stub

inputs:
  required:
    - farm_context
    - sensor
    - expected_fields
    - current_time  # added in v0.1.2-timefix: prior training data used a single
      # fixed timestamp per label, so the model memorized "date == X -> normal
      # vs stale" instead of learning a real staleness rule (age > 1hr). See
      # pilots[0].timefix_investigation in this file.

outputs:
  schema:
    - data_quality_labels
    - missing_fields
    - suspect_fields
    - safe_next_checks
    - human_review_required
    - rationale

safety:
  advisory_only: true
  final_authority: false
  requires_deterministic_checker: true

integration:
  pomona_flow: |
    sensor input -> sensor quality reasoner -> crop risk reasoner -> safety triage reasoner
  service:
    - model-router
    - safety-checker

evaluation:
  clean_holdout:
    status: failed_publish_gate
    cases: 180
    dataset_zip: private/colab/pomona-sensor-quality-v0.1.1-clean-eval-data.zip
    notebook: private/colab/pomona_sensor_quality_v0_1_1_clean_eval_colab.ipynb
    exact_train_overlap: 0
    local_full_eval_report: private/colab/outputs/unpublished_model_full_clean_eval.json
    results:
      valid_json_rate: 1.0
      required_fields_rate: 0.966667
      allowed_labels_rate: 1.0
      label_f1_avg: 0.538889
      missing_f1_avg: 0.833333
      suspect_f1_avg: 0.588889
      human_review_match_rate: 0.933333
    publish_gate:
      valid_json_rate: 1.0
      required_fields_rate: 1.0
      allowed_labels_rate: 1.0
      label_f1_avg_min: 0.9
      missing_f1_avg_min: 0.9
      suspect_f1_avg_min: 0.9
      human_review_match_rate_min: 0.95
  local_full_test:
    version: v0.1.1-boundary
    cases: 270
    valid_json_rate: 1.0
    allowed_labels_rate: 1.0
    exact_match_rate: 0.319
    label_f1_avg: 0.793
    missing_f1_avg: 1.0
    suspect_f1_avg: 0.788
    human_review_match_rate: 0.933
  notes: Independent holdout failed the publish gate. Prioritize normal and unit-mismatch separation, impossible-pH cases, and generalized missing-field examples.

pilots:
  - id: qwen3.5-0.8b-base-rebase
    status: timefix_retrain_near_miss_phrange_fix_applied_awaiting_second_retrain
    base_model: Qwen/Qwen3.5-0.8B
    rationale: >
      v0.1 on Qwen2.5-0.5B-Instruct fails the publish gate (label_f1_avg 0.539,
      suspect_f1_avg 0.589, both need >=0.9). Piloting a newer base model since
      this reasoner is unpublished and has no live traffic to regress.
    notebook: private/colab/pomona_sensor_quality_reasoner_v0_1_qwen3_5_pilot_colab.ipynb
    dataset_zip: private/colab/pomona-sensor-quality-v0.1.3-phrange-training-data.zip  # supersedes v0.1 and v0.1.2-timefix
    training:
      trained_in: Google Colab (T4 GPU), transformers+peft+bitsandbytes 4-bit QLoRA
      epochs: 1
      note: >
        Dropped from 2 to 1 epoch after epoch-1 val loss already hit ~0.002
        (converged); also disabled gradient checkpointing since 0.8B fits a T4
        in 4-bit without it. Both changes were needed to fit under Colab
        free-tier's disconnect window after an earlier 2-epoch/checkpointing
        run (~53min projected) got interrupted around 30min.
    same_distribution_test_results:
      description: >
        In-notebook held-out test.jsonl split (same generator/distribution as
        train, NOT the independent clean holdout below). Re-run independently
        on the downloaded adapter locally (M4 Pro, MPS, bf16, transformers+peft)
        to verify the Colab run, using the identical scoring code from the
        notebook's eval cell.
      cases: 210
      valid_json_rate: 1.0
      exact_match_rate: 0.929
      label_f1_avg: 0.933
      missing_f1_avg: 1.0
      suspect_f1_avg: 0.933
      human_review_match_rate: 0.933
    comparison_to_v0_1_local_full_test:
      note: v0.1's local_full_test above (270 cases, same style of eval, different split size)
      label_f1_avg: "0.793 -> 0.933"
      suspect_f1_avg: "0.788 -> 0.933"
      exact_match_rate: "0.319 -> 0.929"
      human_review_match_rate: "0.933 -> 0.933 (unchanged, still below the 0.95 gate)"
    independent_clean_holdout_results:
      description: >
        Real gate-deciding result, run via pomona_sensor_quality_reasoner_v0_1_qwen3_5_pilot_clean_eval_colab.ipynb
        against pomona-sensor-quality-v0.1.1-clean-eval-data.zip (the same
        independent holdout v0.1 failed on), using the prompt this adapter
        was actually trained on (NOT the v0.1.1-boundary eval notebook's
        different prompt -- see that notebook's markdown cell for why).
      cases: 180
      valid_json_rate: 1.0
      required_fields_rate: 1.0
      allowed_labels_rate: 1.0
      label_f1_avg: 0.767
      missing_f1_avg: 0.833
      suspect_f1_avg: 0.767
      human_review_match_rate: 0.933
      exact_match_rate: 0.0
      verdict: FAILED_PUBLISH_GATE
      comparison_to_v0_1_clean_holdout:
        label_f1_avg: "0.539 -> 0.767 (improved, still fails 0.9 gate)"
        missing_f1_avg: "0.833 -> 0.833 (unchanged, still fails 0.9 gate)"
        suspect_f1_avg: "0.589 -> 0.767 (improved, still fails 0.9 gate)"
        human_review_match_rate: "0.933 -> 0.933 (unchanged, still fails 0.95 gate)"
    timefix_investigation:
      root_cause: >
        bucket_label_f1 breakdown showed "normal": 0.0 (complete failure) while
        every anomaly bucket scored 1.0. All 10 sampled failures were "normal"
        (no-issue) cases the model mislabeled as stale_reading. Traced to the
        training-data generator: scripts/datasets/build_pomona_sensor_quality_dataset.py
        hardcoded every non-stale case's sensor.timestamp to the literal string
        "2026-07-07T10:00:00Z" and every stale_reading case to
        "2026-07-06T08:00:00Z" (one day earlier) -- two fixed dates across all
        1692 training examples, perfectly correlated with the label. The model
        memorized "date == 07-07 -> normal, date == 07-06 -> stale" instead of
        learning to compute staleness. The clean holdout independently used
        "2026-07-10" for both classes (build_pomona_sensor_quality_clean_eval_dataset.py
        had the same hardcoded-date bug, just a different date than training --
        which is exactly what exposed the mismatch). No input field ever told
        the model what time "now" was, so an absolute-date shortcut was the
        only thing available to learn; a bigger/newer base model does not fix
        this, it just exploits the shortcut more efficiently.
      fix_applied:
        - "scripts/datasets/build_pomona_sensor_quality_dataset.py: added current_time to every generated input; sensor.timestamp is now current_time minus a random 0-45min offset (normal/other scenarios) or a random 1.2-72hr offset (stale_reading), matching the real >1hr staleness gate in services/model-router/app/sensor_quality.py's stale_timestamp(). current_time itself is randomized across a wide date/time range (random_current_time()) so no single calendar date correlates with any label."
        - "scripts/datasets/build_pomona_sensor_quality_clean_eval_dataset.py: same fix, independent random date range/seed from the training generator, current_time added to each record's input, expected_output still derived from the real services/model-router/app/sensor_quality.py::derive_sensor_quality (ground truth unchanged, only the previously-fixed NOW/timestamp made variable)."
        - "datasets/pomona-sensor-quality-v0.1/data/samples.jsonl: added current_time (timestamp + 3min) to the 6 seed records for schema consistency."
        - "models/registry/sensor-quality-reasoner-v0.1.yaml inputs.required: added current_time."
        - "Both Qwen3.5 pilot notebooks (train + clean-eval): SYSTEM_PROMPT now says to use stale_reading when current_time minus sensor.timestamp exceeds 1 hour (not \"when timestamp is stale\"); make_prompt's user JSON now includes current_time."
      regenerated_datasets:
        training: private/colab/pomona-sensor-quality-v0.1.2-timefix-training-data.zip (1692/210/210 split, same sizes as v0.1)
        clean_holdout: private/colab/pomona-sensor-quality-v0.1.2-timefix-clean-eval-data.zip (180 cases, same bucket layout as v0.1.1)
      updated_notebooks:
        train: private/colab/pomona_sensor_quality_reasoner_v0_1_qwen3_5_pilot_colab.ipynb (now points at the v0.1.2-timefix training zip; adapter output renamed to pomona-sensor-quality-reasoner-v0.1.2-timefix-qwen3.5-pilot-lora)
        clean_eval: private/colab/pomona_sensor_quality_reasoner_v0_1_qwen3_5_pilot_clean_eval_colab.ipynb (now points at the v0.1.2-timefix clean-eval zip and the renamed adapter)
      note: >
        This bug predates the Qwen3.5 pilot and likely also depressed v0.1's
        own 0.539 clean-holdout label_f1_avg (its bucket_label_f1 was never
        checked). Not retroactively fixing v0.1's already-trained adapter --
        only the not-yet-retrained Qwen3.5 pilot is affected by this round.
    timefix_retrain_clean_holdout_results:
      description: >
        First retrain on the v0.1.2-timefix data (current_time added, 1 epoch,
        batch_size=1/grad_accum=16/gradient_checkpointing=True after two OOM
        failures at batch_size=2 -- second OOM was leftover GPU memory from
        the first OOM'd attempt in the same Colab runtime, not a real capacity
        issue; fixed by a full Runtime > Disconnect and delete runtime, not
        just Restart session). Evaluated on the v0.1.2-timefix clean holdout.
      cases: 180
      valid_json_rate: 1.0
      required_fields_rate: 1.0
      allowed_labels_rate: 1.0
      label_f1_avg: 0.939
      missing_f1_avg: 1.0
      suspect_f1_avg: 0.944
      human_review_match_rate: 0.944
      exact_match_rate: 0.011
      verdict: NEAR_MISS
      gate_check:
        label_f1_avg: "0.939 >= 0.9 PASS"
        missing_f1_avg: "1.0 >= 0.9 PASS"
        suspect_f1_avg: "0.944 >= 0.9 PASS"
        human_review_match_rate: "0.944 < 0.95 FAIL (170/180 correct; 171/180 needed -- one case away)"
      bucket_label_f1_notable:
        stale_reading: 1.0  # timefix worked -- this was the 0.0-scoring bucket before
        normal: 0.167  # new, narrower issue -- see phrange_investigation
        unit_mismatch: 0.917  # 1 miss, not investigated (minor, not the human_review_match_rate cause)
      root_cause_of_human_review_miss: >
        All 10 human_review_match_rate mismatches are exactly the 10 (of 12)
        "normal" bucket cases the model wrongly labeled impossible_ph
        (10/180 = 0.0556 mismatch rate = the observed 0.944 match rate
        exactly). Fixing that one bucket should clear the gate outright.
    phrange_investigation:
      root_cause: >
        Every clean-holdout "normal" failure got the exact same canned
        response, word-for-word identical to training's impossible_ph
        rationale ("pH is outside plausible agricultural sensor range.") --
        a memorization signal, not a reasoning error. Compared clean-holdout
        normal-bucket pH values (5.55-6.59) against the training generator's
        normal-case pH range (round(rng.uniform(5.6, 6.8), 2)): the 2 cases
        the model got right (pH 6.07, 6.33) sit near the center of that
        narrow 1.2-wide training range; all 10 failures sit toward its edges
        (including one value, 5.55, technically just below the training
        floor). The model wasn't taught enough boundary-adjacent "still
        normal" pH examples to stay confident near the edges of its own
        narrow training distribution, so it fell back to the nearest strongly
        memorized pattern (impossible_ph's canned response) instead of
        reasoning about the actual value. Same underlying lesson as the
        timefix bug: too little value diversity near a decision boundary.
      fix_applied:
        - "scripts/datasets/build_pomona_sensor_quality_dataset.py: base_input's ph range widened from round(rng.uniform(5.6, 6.8), 2) to round(rng.uniform(5.0, 7.5), 2) -- comfortably contains all clean-holdout normal pH values (5.55-6.59) well inside the interior, not near an edge. Verified no overlap with impossible_ph values (2.9, 12.8, 13.5, 14.0, still 2+ units clear) or the sensor_drift_possible scenario (7.05-7.15 absolute pH, distinguished by the presence of previous_ph, not pH's absolute value, so the range overlap there is harmless)."
        - "Did NOT touch scripts/datasets/build_pomona_sensor_quality_clean_eval_dataset.py's pH values -- that dataset is the fixed independent yardstick; narrowing the test to match training would defeat the point of an independent holdout. Only the training distribution needed to widen to cover it properly."
      regenerated_dataset:
        training: private/colab/pomona-sensor-quality-v0.1.3-phrange-training-data.zip (1692/210/210 split, same sizes as v0.1 and v0.1.2)
        clean_holdout: unchanged, still private/colab/pomona-sensor-quality-v0.1.2-timefix-clean-eval-data.zip
      updated_notebooks:
        train: private/colab/pomona_sensor_quality_reasoner_v0_1_qwen3_5_pilot_colab.ipynb (now points at the v0.1.3-phrange training zip; adapter output renamed to pomona-sensor-quality-reasoner-v0.1.3-phrange-qwen3.5-pilot-lora)
        clean_eval: private/colab/pomona_sensor_quality_reasoner_v0_1_qwen3_5_pilot_clean_eval_colab.ipynb (adapter upload prompt renamed to match; clean-holdout zip reference unchanged)
    next_step: >
      Retrain using the v0.1.3-phrange training zip (same notebook, same
      batch_size=1/grad_accum=16/gradient_checkpointing=True settings that
      fixed the OOM -- remember a full Runtime > Disconnect and delete
      runtime before this run, not just Restart session), then re-run the
      clean-eval notebook against the (unchanged) v0.1.2-timefix clean-eval
      zip with the newly renamed adapter. If human_review_match_rate clears
      0.95 this time (the other three metrics already clear 0.9), this is
      ready for a model card + HF publish.
    adapter_local_copy: >
      Two superseded adapters sit in ~/Downloads and should not be published:
      pomona-sensor-quality-reasoner-v0.1-qwen3.5-pilot-lora.zip (pre-timefix)
      and pomona-sensor-quality-reasoner-v0.1.2-timefix-qwen3.5-pilot-lora.zip
      (timefix but pre-phrange, the NEAR_MISS result above). Only publish the
      next retrain's pomona-sensor-quality-reasoner-v0.1.3-phrange-qwen3.5-pilot-lora.zip,
      and only if it clears the gate.
