site_name: Pomona
site_url: https://okyanu.github.io/pomona/
site_description: >-
  Open edge AI for greenhouse and hydroponic agriculture with MQTT,
  compact reasoners, deterministic safety checks, and a local dashboard.
repo_name: okyanu/pomona
repo_url: https://github.com/okyanu/pomona
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Pomona Contributors · Apache-2.0
exclude_docs: README.md

theme:
  name: material
  language: en
  logo: assets/pomona-mark.svg
  favicon: assets/pomona-mark.svg
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: green
      accent: light green
      toggle:
        icon: material/weather-night
        name: Use dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: green
      accent: light green
      toggle:
        icon: material/weather-sunny
        name: Use light mode
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.action.edit

nav:
  - Home: index.md
  - Get started:
      - Quickstart: GETTING_STARTED.md
      - Installation: INSTALL.md
      - Plug and play: PLUG_AND_PLAY.md
      - Local validation: LOCAL_VALIDATION.md
  - Platform:
      - Architecture: architecture.md
      - Project status: PROJECT_STATUS.md
      - Roadmap: ROADMAP.md
      - Phases: PHASES.md
  - Reasoners:
      - Model catalog: MODEL_CATALOG.md
      - Tomato risk: TOMATO_RISK_REASONER.md
      - Water and irrigation: WATER_IRRIGATION_RISK_REASONER.md
      - Nutrient, pH and EC: NUTRIENT_PH_EC_REASONER.md
      - Sensor quality: SENSOR_QUALITY_REASONER.md
      - Safety triage: SAFETY_TRIAGE_REASONER.md
      - Actuator command gate: ACTUATOR_COMMAND_GATE_REASONER.md
  - Hardware:
      - Hardware event contract: HARDWARE_EVENT_CONTRACT.md
      - Edge controller notes: EDGE_CONTROLLER_DESIGN_NOTES.md
  - Contribute:
      - Publishing: PUBLISHING.md
      - Repository map: REPOS.md
      - Versioning: VERSIONING.md

plugins:
  - search

# Some public docs intentionally link to source files that live outside docs/.
# MkDocs cannot copy those targets into the Pages artifact, so keep the links
# visible without treating them as deployment failures.
validation:
  links:
    not_found: info
    unrecognized_links: info

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/okyanu/pomona
      name: Pomona on GitHub
    - icon: simple/huggingface
      link: https://huggingface.co/Okyanus
      name: Pomona models on Hugging Face
