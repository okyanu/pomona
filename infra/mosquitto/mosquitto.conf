# Pomona broker: a login is required. There is no anonymous access.
# The password file is NOT in this repo or on the host: docker-compose.yml builds it inside the container
# at startup from MQTT_USERNAME / MQTT_PASSWORD (see .env.example) into the container's private /tmp.
# Plain MQTT, no TLS: for the local network only. Never port-forward 1883 to the internet.
listener 1883
allow_anonymous false
password_file /tmp/mosquitto.passwd
persistence false
