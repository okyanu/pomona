name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [core, model-router, dashboard, safety-checker, digital-twin, automation-engine]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        if: matrix.service == 'dashboard'
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          pip install -r services/${{ matrix.service }}/requirements.txt pytest httpx pyyaml

      - name: Run tests
        working-directory: services/${{ matrix.service }}
        run: PYTHONPATH=. pytest tests/ -v

      - name: Dataset contract and evaluation hygiene
        if: matrix.service == 'model-router'
        run: python -m pytest scripts/datasets/tests -q
