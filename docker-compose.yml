# Container lockdown (every Pomona service): unprivileged user (uid 10001, set in each
# Dockerfile), read-only root filesystem, all Linux capabilities dropped, no privilege
# escalation, and CPU / memory limits. Writable state lives only in the named volumes.
# Limits can be raised in .env (e.g. MODEL_ROUTER_MEM_LIMIT=8g for the Hugging Face backend).
x-hardened: &hardened
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: ["/tmp:size=64m,mode=1777"]

services:
  mqtt:
    image: eclipse-mosquitto:2
    <<: *hardened
    user: "1883:1883"   # the image's mosquitto user; persistence is off, config is read-only
    mem_limit: ${MQTT_MEM_LIMIT:-128m}
    cpus: ${MQTT_CPUS:-0.5}
    ports:
      - "1883:1883"
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -t '$$SYS/broker/version' -C 1 -W 3 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  core:
    build: ./services/core
    <<: *hardened
    mem_limit: ${CORE_MEM_LIMIT:-512m}
    cpus: ${CORE_CPUS:-1.0}
    ports:
      - "8080:8080"
    environment:
      CORE_HOST: ${CORE_HOST:-0.0.0.0}
      CORE_PORT: ${CORE_PORT:-8080}
      MQTT_HOST: ${MQTT_HOST:-mqtt}
      MQTT_PORT: ${MQTT_PORT:-1883}
      MQTT_TOPIC_PATTERN: ${MQTT_TOPIC_PATTERN:-pomona/+/+/sensor/+/state}
      DB_PATH: ${DB_PATH:-/app/data/pomona.db}
      MAX_EVENTS: ${MAX_EVENTS:-100000}
      RETENTION_DAYS: ${RETENTION_DAYS:-7}
      DEVICE_TIMEOUT_SECONDS: ${DEVICE_TIMEOUT_SECONDS:-120}
      API_KEY: ${API_KEY:-}
    volumes:
      - core_data:/app/data
    depends_on:
      mqtt:
        condition: service_healthy

  model-router:
    build: ./services/model-router
    <<: *hardened
    mem_limit: ${MODEL_ROUTER_MEM_LIMIT:-2g}
    cpus: ${MODEL_ROUTER_CPUS:-2.0}
    ports:
      - "8081:8081"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      MODELS_DIR: /app/models/registry
      AUDIT_LOG_PATH: /app/data/pomona-pipeline-audit.jsonl
      HF_HOME: /app/data/huggingface
      POMONA_LLM_BACKEND: ${POMONA_LLM_BACKEND:-stub}
      HF_MODEL_ID: ${HF_MODEL_ID:-Okyanus/ai-pomona-agronomist-gemma4}
      HF_BASE_MODEL_ID: ${HF_BASE_MODEL_ID:-google/gemma-4-E2B-it}
      HF_TOKEN: ${HF_TOKEN:-}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-ai-pomona-agronomist-gemma4}
      REASONER_BACKEND: ${REASONER_BACKEND:-rules}
      TOMATO_RISK_OLLAMA_MODEL: ${TOMATO_RISK_OLLAMA_MODEL:-pomona-tomato-risk:v0.1.7-local}
      WATER_IRRIGATION_OLLAMA_MODEL: ${WATER_IRRIGATION_OLLAMA_MODEL:-pomona-water-irrigation:v0.1.8}
      NUTRIENT_PH_EC_OLLAMA_MODEL: ${NUTRIENT_PH_EC_OLLAMA_MODEL:-pomona-nutrient-ph-ec:v0.1.1}
      MLX_HOST: ${MLX_HOST:-http://host.docker.internal:8083}
      WATER_IRRIGATION_MLX_MODEL: ${WATER_IRRIGATION_MLX_MODEL:-}
    volumes:
      - ./models/registry:/app/models/registry:ro
      - ./services/safety-checker/app:/app/safety_checker_rules:ro
      - router_data:/app/data
    depends_on:
      core:
        condition: service_started

  dashboard:
    build: ./services/dashboard
    <<: *hardened
    mem_limit: ${DASHBOARD_MEM_LIMIT:-256m}
    cpus: ${DASHBOARD_CPUS:-0.5}
    ports:
      - "3000:3000"
    environment:
      CORE_URL: ${CORE_URL:-http://core:8080}
      MODEL_ROUTER_URL: ${MODEL_ROUTER_URL:-http://model-router:8081}
      SAFETY_CHECKER_URL: ${SAFETY_CHECKER_URL:-http://safety-checker:8082}
      DIGITAL_TWIN_URL: ${DIGITAL_TWIN_URL:-http://digital-twin:8084}
      AUTOMATION_ENGINE_URL: ${AUTOMATION_ENGINE_URL:-http://automation-engine:8085}
    depends_on:
      core:
        condition: service_started
      model-router:
        condition: service_started

  digital-twin:
    build: ./services/digital-twin
    <<: *hardened
    mem_limit: ${DIGITAL_TWIN_MEM_LIMIT:-256m}
    cpus: ${DIGITAL_TWIN_CPUS:-0.5}
    ports:
      - "8084:8084"

  automation-engine:
    build: ./services/automation-engine
    <<: *hardened
    mem_limit: ${AUTOMATION_MEM_LIMIT:-256m}
    cpus: ${AUTOMATION_CPUS:-0.5}
    environment:
      AUTOMATION_DB_PATH: /data/automation.db
      MAX_SUGGESTIONS: ${MAX_SUGGESTIONS:-200}
      SUGGESTION_TTL_SECONDS: ${SUGGESTION_TTL_SECONDS:-900}
      SUGGESTION_SAMPLE_MAX_AGE_SECONDS: ${SUGGESTION_SAMPLE_MAX_AGE_SECONDS:-3600}
    volumes:
      - automation_data:/data
    ports:
      - "8085:8085"

  safety-checker:
    build: ./services/safety-checker
    <<: *hardened
    mem_limit: ${SAFETY_CHECKER_MEM_LIMIT:-256m}
    cpus: ${SAFETY_CHECKER_CPUS:-0.5}
    ports:
      - "8082:8082"
    depends_on:
      model-router:
        condition: service_started

  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    # Third-party image that writes its own state: no privilege escalation, but no other lockdown.
    security_opt: ["no-new-privileges:true"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/var/lib/ollama

volumes:
  automation_data:
  core_data:
  router_data:
  ollama_data:
